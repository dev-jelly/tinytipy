# Gitea pull-mirror CI. Source checks are retained from .github/workflows.
# GitHub Pages publication remains in the GitHub workflow until artifact handoff is configured.
name: Deploy playground to GitHub Pages
'on':
  push: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9.12.0
        run_install: false
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Build playground and workspace dependencies
      run: pnpm --filter playground... build
    - name: Store verified static site
      uses: actions/upload-artifact@v4
      with:
        name: static-site
        path: examples/playground/dist
        include-hidden-files: true
        retention-days: 14
    timeout-minutes: 60
